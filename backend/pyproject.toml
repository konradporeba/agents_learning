[project]
name = "triage-copilot"
version = "0.1.0"
description = "Triage Copilot backend"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.3",
]

[project.scripts]
triage-copilot = "triage_copilot:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff==0.17.5",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
